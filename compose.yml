services:
  backend:
    build: ./backend
    develop:
      watch:
        - path: ./backend
          action: rebuild

  frontend:
    build: ./frontend
    develop:
      watch:
        - path: ./frontend
          action: rebuild

  nginx:
    image: nginx:1.29.2
    ports:
      - 80:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_started
        restart: true
      frontend:
        condition: service_started
        restart: true
    develop:
      watch:
        - path: ./nginx
          action: restart
