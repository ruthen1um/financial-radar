services:
  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # Увеличиваем лимиты для high-load сценариев
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >-
        +S 4:4
        +stbt db
        +sbwt very_short
        +swt very_low
    ports:
      - "5672:5672"     # amqp
      - "15672:15672"   # management web UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Увеличиваем ресурсы для RabbitMQ
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  app:
    build: .
    container_name: financial-ingest
    ports:
      - "80:80"
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      JUNK_LOG_DIR: "/var/log/financial_radar"
    volumes:
      - ./logs:/var/log/financial_radar
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    # Увеличиваем ресурсы для app
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 256M

volumes:
  rabbitmq_data: